<!DOCTYPE html>
<html>

<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">

    <!-- ✅ ADD THIS (Chart.js REQUIRED) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- ✅ SIDEBAR -->
    <div class="sidebar">
        <h2>🛠 Admin</h2>
        <a href="dashboard.html">Dashboard</a>
        <a href="#">Manage Flights</a>
        <a href="#">Bookings</a>
    </div>

    <!-- ✅ MAIN -->
    <div class="main">

        <div class="airline-navbar">🛠️ Admin Panel</div>

        <!-- ✅ TOP CARDS -->
        <div class="top-cards">
            <div class="stat-card">
                <h3>Total Flights</h3>
                <p id="totalFlights">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Bookings</h3>
                <p id="totalBookings">0</p>
            </div>
            <div class="stat-card">
                <h3>System Status</h3>
                <p>Active</p>
            </div>
        </div>

        <div class="container">

            <!-- ✅ ML GRAPH SECTION -->
            <h2>📈 AI Dynamic Pricing Graph</h2>
            <div style="background: white; padding: 20px; border-radius: 12px; margin-bottom: 40px;">
                <canvas id="aiPricingChart"></canvas>
            </div>

            <!-- ✅ ADD FLIGHT FORM -->
            <h2>Add Flight</h2>

            <div class="admin-form">
                <input type="text" id="flight_no" placeholder="Flight No">
                <input type="text" id="source" placeholder="Source">
                <input type="text" id="destination" placeholder="Destination">
                <input type="datetime-local" id="departure">
                <input type="datetime-local" id="arrival">

                <button class="btn" onclick="addFlight()">Add Flight</button>
            </div>

            <hr><br>

            <!-- ✅ FLIGHT LIST -->
            <h2>All Flights</h2>
            <div id="flightList" class="flight-grid"></div>

            <hr><br>

            <!-- ✅ BOOKINGS -->
            <h2>All Bookings</h2>
            <div id="bookingList" class="flight-grid"></div>

        </div>

    </div>

    <script>
        let chartInstance = null;

        // ✅ LOAD ML GRAPH
        function loadMLGraph() {
            fetch("http://127.0.0.1:5000/ml_graph")
                .then(res => res.json())
                .then(data => {

                    if (!data || data.error) return;

                    const canvas = document.getElementById('aiPricingChart');
                    if (!canvas) return;

                    const ctx = canvas.getContext('2d');

                    const labels = data.map(d => d.seats_left + " seats");
                    const prices = data.map(d => d.predicted_price);

                    // 🔥 Fix duplicate chart issue
                    if (chartInstance) chartInstance.destroy();

                    chartInstance = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'AI Predicted Ticket Price (₹)',
                                data: prices,
                                borderColor: '#ff8f00',
                                backgroundColor: 'rgba(255,143,0,0.2)',
                                borderWidth: 3,
                                fill: true,
                                tension: 0.4
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                x: {
                                    title: { display: true, text: 'Seats Left' }
                                },
                                y: {
                                    title: { display: true, text: 'Price (₹)' }
                                }
                            }
                        }
                    });
                })
                .catch(err => console.error(err));
        }

        // ✅ ADD FLIGHT
        function addFlight() {
            fetch("http://127.0.0.1:5000/add_flight", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    flight_no: document.getElementById("flight_no").value,
                    source: document.getElementById("source").value,
                    destination: document.getElementById("destination").value,
                    departure: document.getElementById("departure").value,
                    arrival: document.getElementById("arrival").value,
                    total_seats: 20
                })
            })
                .then(res => res.json())
                .then(() => {
                    alert("Flight Added ✅");
                    loadFlights();
                    loadMLGraph(); // refresh graph
                });
        }

        // ✅ LOAD FLIGHTS
        function loadFlights() {
            fetch("http://127.0.0.1:5000/flights")
                .then(res => res.json())
                .then(data => {

                    document.getElementById("totalFlights").innerText = data.length;

                    let html = "";

                    data.forEach(f => {
                        html += `
                        <div class="flight-card">
                            <h3>${f.flight_no}</h3>
                            <p>${f.source} → ${f.destination}</p>
                            <button class="btn cancel-btn"
                                onclick="deleteFlight(${f.flight_id})">
                                Delete
                            </button>
                        </div>`;
                    });

                    document.getElementById("flightList").innerHTML = html;
                });
        }

        // ✅ DELETE FLIGHT
        function deleteFlight(id) {
            fetch(`http://127.0.0.1:5000/delete_flight/${id}`, {
                method: "DELETE"
            })
                .then(res => res.json())
                .then(() => {
                    alert("Deleted ❌");
                    loadFlights();
                    loadMLGraph(); // refresh graph
                });
        }

        // ✅ LOAD BOOKINGS
        function loadBookings() {
            fetch("http://127.0.0.1:5000/bookings")
                .then(res => res.json())
                .then(data => {

                    document.getElementById("totalBookings").innerText = data.length;

                    let html = "";

                    data.forEach(b => {
                        html += `
                        <div class="flight-card">
                            <h3>${b.flight_no}</h3>
                            <p>Seat: ${b.seat_no}</p>
                            <p>Status: ${b.status}</p>
                        </div>`;
                    });

                    document.getElementById("bookingList").innerHTML = html;
                });
        }

        // ✅ INIT
        loadMLGraph();
        loadFlights();
        loadBookings();
    </script>

</body>

</html>
